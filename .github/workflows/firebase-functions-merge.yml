name: "Production: Firebase Functions"
on:
  push:
    branches: [production]
    paths: ["functions/**", "firebase.json", ".firebaserc", ".github/workflows/firebase-functions-merge.yml"]
  workflow_dispatch:
    inputs:
      purge_fluidlab_data:
        description: "Purge FluidLab projects and nested versions after deployment"
        required: false
        default: false
        type: boolean
concurrency: { group: functions-production, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Prod
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: functions/package-lock.json }
      - name: Validate deployment identity
        run: |
          test -n "${{ secrets.GCP_WIF_PROVIDER }}" || { echo "Missing GCP_WIF_PROVIDER"; exit 1; }
          test -n "${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}" || { echo "Missing GCP_SERVICE_ACCOUNT_EMAIL"; exit 1; }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      - run: npm ci --prefix functions
      - run: find functions -path 'functions/node_modules' -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npm test --prefix functions
      - run: npm install --global firebase-tools@14.15.2
      - run: firebase deploy --only functions --project uniqenergy-de71c --non-interactive --message "CI functions deploy"
      - name: Purge obsolete FluidLab project data
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.purge_fluidlab_data }}
        run: node functions/purge-fluidlab-projects.js --confirm
