name: "Production: Firebase Functions"
on:
  push:
    branches: [production]
    paths: ["functions/**", "scripts/configure-fluidlab-cloud.py", "firebase.json", ".firebaserc", ".github/workflows/firebase-functions-merge.yml"]
  workflow_dispatch:
concurrency: { group: functions-production, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Prod
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: functions/package-lock.json }
      - name: Validate deployment identity
        run: |
          test -n "${{ secrets.GCP_WIF_PROVIDER }}" || { echo "Missing GCP_WIF_PROVIDER"; exit 1; }
          test -n "${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}" || { echo "Missing GCP_SERVICE_ACCOUNT_EMAIL"; exit 1; }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure FluidLab APIs and secret access
        run: python3 scripts/configure-fluidlab-cloud.py
      - run: npm ci --prefix functions
      - run: find functions -path 'functions/node_modules' -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npm run lint --prefix functions
      - run: env -u GOOGLE_APPLICATION_CREDENTIALS -u CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE -u GOOGLE_GHA_CREDS_PATH npm test --prefix functions
      - run: npm install --global firebase-tools@14.15.2
      - name: Select affected functions
        id: affected
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 - <<'PYCODE'
          import os, re, subprocess
          before = os.environ.get("BEFORE_SHA", "")
          target = "functions"
          if before and set(before) != {"0"}:
              paths = subprocess.check_output(["git", "diff", "--name-only", before, os.environ["GITHUB_SHA"]], text=True).splitlines()
              runtime = [p for p in paths if p.startswith("functions/") and not p.startswith(("functions/test/", "functions/scripts/"))]
              if runtime and all(p.startswith("functions/apps/fluidlab/") for p in runtime):
                  with open("functions/index.js") as source:
                      exports = re.findall(r'export \{([^}]+)\} from "\./apps/fluidlab/service\.js"', source.read())
                  target = ",".join("functions:" + name.strip() for group in exports for name in group.split(","))
                  if not target:
                      raise SystemExit("No FluidLab exports found")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("target=" + target + "\n")
          PYCODE
      - run: firebase deploy --only "${{ steps.affected.outputs.target }}" --project uniqenergy-de71c --non-interactive --force --message "CI functions deploy"
      - name: Configure FluidLab task dispatch
        run: python3 scripts/configure-fluidlab-cloud.py --after-deploy
