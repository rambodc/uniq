name: "Production: Firebase Rules"
on:
  push:
    branches: [production]
    paths: ["firestore.rules", "storage.rules", "storage.cors.json", "firestore.indexes.json", "tests/rules.test.mjs", "firebase.json", "package.json", "package-lock.json", ".github/workflows/firebase-rules-merge.yml"]
  workflow_dispatch:
concurrency: { group: rules-production, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Prod
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Validate deployment identity
        run: |
          test -n "${{ secrets.GCP_WIF_PROVIDER }}" || { echo "Missing GCP_WIF_PROVIDER"; exit 1; }
          test -n "${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}" || { echo "Missing GCP_SERVICE_ACCOUNT_EMAIL"; exit 1; }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure private well Storage access
        run: |
          gcloud projects add-iam-policy-binding uniqenergy-de71c --member="serviceAccount:service-357883281274@gcp-sa-firebasestorage.iam.gserviceaccount.com" --role="roles/firebaserules.firestoreServiceAgent" --condition=None --quiet
          gcloud storage buckets update gs://uniqenergy-de71c.firebasestorage.app --cors-file=storage.cors.json
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm install --global firebase-tools@14.15.2
      - name: Test private storage and library lifecycle
        env:
          FIREBASE_CONFIG: '{"projectId":"uniqenergy-de71c","storageBucket":"uniqenergy-de71c.firebasestorage.app"}'
        run: firebase emulators:exec --only firestore,storage "node --test tests/rules.test.mjs && npm test --prefix functions"
      - run: firebase deploy --only firestore:rules,firestore:indexes,storage --project uniqenergy-de71c --non-interactive --message "CI rules deploy"
