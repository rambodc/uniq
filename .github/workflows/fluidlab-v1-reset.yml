name: "One-time: FluidLab clean-slate reset"
on:
  workflow_dispatch:
jobs:
  reset:
    runs-on: ubuntu-latest
    environment: Prod
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: functions/package-lock.json }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      - run: npm ci --prefix functions
      - name: Purge legacy FluidLab projects and reset failed analysis usage
        run: node functions/reset-fluidlab-v1.js
