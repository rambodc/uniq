name: "PR: Firebase Functions"
on:
  pull_request:
    paths: ["functions/**", "firebase.json", ".firebaserc", ".github/workflows/firebase-functions-pull-request.yml"]
concurrency: { group: "functions-pr-${{ github.event.pull_request.number }}", cancel-in-progress: true }
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: functions/package-lock.json }
      - run: npm ci --prefix functions
      - run: find functions -path 'functions/node_modules' -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npm test --prefix functions
