name: "PR: Firebase Hosting"
on:
  pull_request:
    paths: ["src/**", "public/**", "index.html", "package.json", "package-lock.json", "vite.config.ts", "firebase.json", ".firebaserc", ".github/workflows/firebase-hosting-pull-request.yml", "functions/miniApps.js"]
concurrency: { group: "hosting-pr-${{ github.event.pull_request.number }}", cancel-in-progress: true }
permissions: { contents: read }
jobs:
  preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint && npm run build && npm test
