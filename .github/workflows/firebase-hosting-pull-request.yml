name: "PR: Firebase Hosting Preview"
on:
  pull_request:
    paths: ["src/**", "public/**", "index.html", "package.json", "package-lock.json", "vite.config.ts", "firebase.json", ".firebaserc", ".github/workflows/firebase-hosting-pull-request.yml"]
concurrency: { group: "hosting-pr-${{ github.event.pull_request.number }}", cancel-in-progress: true }
permissions: { id-token: write, contents: read }
jobs:
  preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment: Prod
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_APPCHECK_SITE_KEY: ${{ secrets.VITE_APPCHECK_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Validate deployment identity
        run: |
          test -n "${{ secrets.GCP_WIF_PROVIDER }}" || { echo "Missing GCP_WIF_PROVIDER"; exit 1; }
          test -n "${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}" || { echo "Missing GCP_SERVICE_ACCOUNT_EMAIL"; exit 1; }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      - run: npm ci
      - run: npm run lint && npm run build && npm test
      - run: npm install --global firebase-tools@14.15.2
      - run: firebase hosting:channel:deploy pr-${{ github.event.pull_request.number }} --project uniqenergy-de71c --expires 7d --non-interactive
